name: Publish Windows installer

# Manual only. Never runs on push, pull_request, or tags.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type publish to confirm creating a GitHub Release'
        required: true
        type: string
      bump:
        description: 'Bump package.json version before publishing'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - none

concurrency:
  group: publish-windows-installer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Windows NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Confirm manual publish
        if: ${{ inputs.confirm != 'publish' }}
        shell: bash
        run: |
          echo "::error::Type publish in the confirm field to start a release."
          exit 1

      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          echo "::error::Run this workflow from the main branch."
          exit 1

      - name: Check required secrets
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY before publishing."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        if: ${{ inputs.bump != 'none' }}
        shell: bash
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          echo "PUBLISH_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Record current version
        if: ${{ inputs.bump == 'none' }}
        shell: bash
        run: echo "PUBLISH_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Commit version bump
        if: ${{ inputs.bump != 'none' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${PUBLISH_VERSION}"
          git push origin HEAD:main

      - name: Build web app
        run: npm run build

      - name: Build and publish Windows installer
        run: npx electron-builder --win --publish always --config electron-builder.json
