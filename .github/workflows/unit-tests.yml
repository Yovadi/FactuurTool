name: Unit tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: |
          set -euo pipefail
          for test in src/utils/*.test.ts; do
            npx --yes tsx "$test"
          done
