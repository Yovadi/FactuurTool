name: Run scheduled jobs

# Hourly runner. Uses the same invoice rules as the Windows app, so a closed
# PC still creates rent and meeting-room drafts. PDF reminders and
# e-Boekhouden stay on the app. Does not call the Edge Function.
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: run-scheduled-jobs
  cancel-in-progress: false

jobs:
  run:
    name: Run due jobs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY."
            exit 1
          fi
      - name: Run due jobs
        shell: bash
        run: npx --yes tsx scripts/run-scheduled-jobs.ts
